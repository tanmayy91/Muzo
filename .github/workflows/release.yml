name: Build and Release Nerox Music

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (for example v3.9.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create Nerox Music installer script
        shell: pwsh
        run: |
          $appName = "Nerox Music"
          $exeName = "nerox_music.exe"
          $buildDir = "build\windows\x64\runner\Release"
          $outFile = "dist\Nerox-Music-Setup.exe"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $nsisScript = @"
          !include "MUI2.nsh"

          Name "${appName}"
          OutFile "${outFile}"
          InstallDir "`$PROGRAMFILES64\${appName}"
          InstallDirRegKey HKCU "Software\${appName}" ""
          RequestExecutionLevel admin

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "${buildDir}\*.*"
            CreateShortcut "`$DESKTOP\${appName}.lnk" "`$INSTDIR\${exeName}"
            CreateDirectory "`$SMPROGRAMS\${appName}"
            CreateShortcut "`$SMPROGRAMS\${appName}\${appName}.lnk" "`$INSTDIR\${exeName}"
            WriteRegStr HKCU "Software\${appName}" "" "`$INSTDIR"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${appName}" "DisplayName" "${appName}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${appName}" "UninstallString" "`$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir /r "`$INSTDIR"
            Delete "`$DESKTOP\${appName}.lnk"
            RMDir /r "`$SMPROGRAMS\${appName}"
            DeleteRegKey HKCU "Software\${appName}"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${appName}"
          SectionEnd
          "@

          Set-Content -Path installer.nsi -Value $nsisScript

      - name: Compile installer
        shell: pwsh
        run: makensis installer.nsi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/Nerox-Music-Setup.exe
          if-no-files-found: error

  build-android:
    name: Build Android packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android local properties
        shell: bash
        run: |
          flutter_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "flutter.sdk=${flutter_sdk}"
          } > android/local.properties

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || {
            echo "ANDROID_KEYSTORE_BASE64 is not configured in repository secrets."
            exit 1
          }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || {
            echo "ANDROID_KEYSTORE_PASSWORD is not configured in repository secrets."
            exit 1
          }
          test -n "${ANDROID_KEY_ALIAS}" || {
            echo "ANDROID_KEY_ALIAS is not configured in repository secrets."
            exit 1
          }
          test -n "${ANDROID_KEY_PASSWORD}" || {
            echo "ANDROID_KEY_PASSWORD is not configured in repository secrets."
            exit 1
          }

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Collect Android artifacts
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/*.apk dist/android/
          cp build/app/outputs/bundle/release/*.aab dist/android/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/android/*
          if-no-files-found: error

  build-ios:
    name: Build iOS archive
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Building without code signing keeps this workflow usable without
      # private Apple certificates. The archive must be signed before installing
      # on a device or uploading to App Store Connect.
      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign

      - name: Package iOS archive
        run: |
          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/archive/Runner.xcarchive \
            dist/ios/Nerox-Music-iOS-unsigned.xcarchive.zip
          find build/ios/ipa -name "*.ipa" -exec cp {} dist/ios/ \; 2>/dev/null || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/ios/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Nerox Music ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: true
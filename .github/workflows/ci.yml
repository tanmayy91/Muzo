name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze and build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android local properties
        shell: bash
        run: |
          flutter_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "flutter.sdk=${flutter_sdk}"
          } > android/local.properties

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Android release APK
        run: flutter build apk --release